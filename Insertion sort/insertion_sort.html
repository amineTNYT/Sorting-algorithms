<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insertion Sort - Interactive Visualization</title>
<meta name="description" content="Grows a sorted region on the left, taking each new element and sliding it back into its correct position.">
<link rel="stylesheet" href="../assets/visualizer.css">
<script>
    // Apply the saved theme before first paint, so the page never flashes
    // the wrong one on load.
    try {
        var savedTheme = localStorage.getItem('sorting-algorithms-theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (error) { /* storage unavailable - fall back to the OS preference */ }
</script>
</head>
<body>

<div class="container">

    <header class="page-header">
        <div>
            <h1>Insertion Sort</h1>
            <p class="subtitle">Grows a sorted region on the left, taking each new element and sliding it back into its correct position.</p>
        </div>
        <div class="header-actions">
            <a class="back-link" href="../index.html">All algorithms</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="panel">
        <div class="buttons">
            <button id="startBtn" type="button">Start Animation</button>
            <button id="generateBtn" type="button">Generate New Example</button>
            <button id="speedBtn" type="button">Speed: Slow (x1)</button>
        </div>
    </div>

    <div class="array-display">
        <div class="array-container" id="arrayContainer"></div>
        <div class="aux-panel" id="auxPanel">
            <div class="aux-title" id="auxTitle"></div>
            <div class="aux-row" id="auxRow"></div>
        </div>
    </div>

    <div class="steps" id="steps" role="status" aria-live="polite"></div>

    <div class="panel">
        <h2>Animation State</h2>
        <div class="status-info">
            <div class="info-item">
                <div class="info-label">Sorted region</div>
                <div class="info-value" id="sortedCount">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Comparisons</div>
                <div class="info-value" id="comparisons">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Shifts</div>
                <div class="info-value" id="shifts">0</div>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#10b981,#059669)"></span>Sorted region
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#ef4444,#dc2626)"></span>Key being placed
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#fbbf24,#d97706)"></span>Comparing
            </div>
        </div>
    </div>

    <footer class="page-footer">
        Created by <strong>Amine</strong> &middot;
        <a href="https://github.com/amineTNYT" target="_blank" rel="noopener">@amineTNYT</a>
        &middot; <a href="./README.md">Notes on this algorithm</a>
    </footer>

</div>

<script src="../assets/visualizer.js"></script>
<script>
SortingVisualizer.create({
    defaultExample: [5, 2, 9, 1, 6],
    randomLength: 8,
    stats: [{ id: 'sortedCount' }, { id: 'comparisons' }, { id: 'shifts' }],
    run: async function (ctx) {
        var n = ctx.length;

        ctx.setClass(0, 'sorted');
        ctx.stat('sortedCount', 1);
        ctx.say('The first element on its own counts as a sorted region of one.');
        await ctx.sleep(1300);

        for (var i = 1; i < n; i++) {
            var key = ctx.arr[i];

            ctx.setClass(i, 'active');
            ctx.tag(i, 'key');
            ctx.say('<strong>Take ' + key + '</strong> and find where it belongs in the sorted region on its left.');
            await ctx.sleep(1200);

            var j = i - 1;
            while (j >= 0) {
                ctx.bump('comparisons');
                ctx.setClass(j, 'comparing');
                ctx.say('Is ' + ctx.arr[j] + ' &gt; ' + key + ' ?');
                await ctx.sleep(900);

                if (ctx.arr[j] > key) {
                    ctx.say('Yes &rarr; shift ' + ctx.arr[j] + ' one place right to open a gap.');
                    ctx.setValue(j + 1, ctx.arr[j]);
                    ctx.bump('shifts');
                    ctx.setClass(j + 1, 'sorted');
                    ctx.setClass(j, 'active');
                    await ctx.sleep(850);
                    j--;
                } else {
                    ctx.say('No &rarr; ' + key + ' belongs just after ' + ctx.arr[j] + '.');
                    ctx.setClass(j, 'sorted');
                    await ctx.sleep(850);
                    break;
                }
            }

            ctx.setValue(j + 1, key);
            ctx.clearTags();
            ctx.setRange(0, i, 'sorted');
            ctx.stat('sortedCount', i + 1);
            await ctx.sleep(700);
        }
    }
});
</script>

</body>
</html>
