<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heap Sort - Interactive Visualization</title>
<meta name="description" content="Arranges the array into a max-heap, then repeatedly moves the root - always the largest value - to the end.">
<link rel="stylesheet" href="../assets/visualizer.css">
<script>
    // Apply the saved theme before first paint, so the page never flashes
    // the wrong one on load.
    try {
        var savedTheme = localStorage.getItem('sorting-algorithms-theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (error) { /* storage unavailable - fall back to the OS preference */ }
</script>
</head>
<body>

<div class="container">

    <header class="page-header">
        <div>
            <h1>Heap Sort</h1>
            <p class="subtitle">Arranges the array into a max-heap, then repeatedly moves the root - always the largest value - to the end.</p>
        </div>
        <div class="header-actions">
            <a class="back-link" href="../index.html">All algorithms</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="panel">
        <div class="buttons">
            <button id="startBtn" type="button">Start Animation</button>
            <button id="generateBtn" type="button">Generate New Example</button>
            <button id="speedBtn" type="button">Speed: Slow (x1)</button>
        </div>
    </div>

    <div class="array-display">
        <div class="array-container" id="arrayContainer"></div>
        <div class="aux-panel" id="auxPanel">
            <div class="aux-title" id="auxTitle"></div>
            <div class="aux-row" id="auxRow"></div>
        </div>
    </div>

    <div class="steps" id="steps" role="status" aria-live="polite"></div>

    <div class="panel">
        <h2>Animation State</h2>
        <div class="status-info">
            <div class="info-item">
                <div class="info-label">Phase</div>
                <div class="info-value" id="phase">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Comparisons</div>
                <div class="info-value" id="comparisons">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Swaps</div>
                <div class="info-value" id="swaps">0</div>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#f472b6,#db2777)"></span>Parent node
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#fbbf24,#d97706)"></span>Child nodes
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#ef4444,#dc2626)"></span>Swapping
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#10b981,#059669)"></span>Final position
            </div>
        </div>
    </div>

    <footer class="page-footer">
        Created by <strong>Amine</strong> &middot;
        <a href="https://github.com/amineTNYT" target="_blank" rel="noopener">@amineTNYT</a>
        &middot; <a href="./README.md">Notes on this algorithm</a>
    </footer>

</div>

<script src="../assets/visualizer.js"></script>
<script>
SortingVisualizer.create({
    defaultExample: [4, 10, 3, 5, 1, 8, 7],
    randomLength: 8,
    stats: [{ id: 'phase' }, { id: 'comparisons' }, { id: 'swaps' }],
    run: async function (ctx) {
        var n = ctx.length;

        function showTree(size) {
            var cells = [];
            for (var i = 0; i < size; i++) {
                var left = 2 * i + 1;
                var right = 2 * i + 2;
                var children = [];
                if (left < size) children.push(ctx.arr[left]);
                if (right < size) children.push(ctx.arr[right]);
                cells.push({
                    key: 'node ' + i,
                    val: ctx.arr[i] + (children.length ? ' &rarr; ' + children.join(',') : '')
                });
            }
            ctx.aux('Heap structure (parent at i, children at 2i+1 and 2i+2)', cells);
        }

        async function heapify(size, i) {
            var largest = i;
            var left = 2 * i + 1;
            var right = 2 * i + 2;

            ctx.setClass(i, 'pivot');
            if (left < size) ctx.setClass(left, 'comparing');
            if (right < size) ctx.setClass(right, 'comparing');
            ctx.say('Check node ' + ctx.arr[i] + ' against its children.');
            await ctx.sleep(1000);

            if (left < size) {
                ctx.bump('comparisons');
                if (ctx.arr[left] > ctx.arr[largest]) largest = left;
            }
            if (right < size) {
                ctx.bump('comparisons');
                if (ctx.arr[right] > ctx.arr[largest]) largest = right;
            }

            if (largest !== i) {
                ctx.setClass(i, 'active');
                ctx.setClass(largest, 'active');
                ctx.say('Child ' + ctx.arr[largest] + ' is larger &rarr; swap it up.');
                await ctx.sleep(900);
                ctx.swap(i, largest);
                ctx.bump('swaps');
                showTree(size);
                await ctx.sleep(700);

                for (var k = 0; k < size; k++) ctx.setClass(k, 'default');
                await heapify(size, largest);
            } else {
                ctx.say('The parent is already the largest &rarr; nothing to do here.');
                await ctx.sleep(700);
                for (var m = 0; m < size; m++) ctx.setClass(m, 'default');
            }
        }

        ctx.stat('phase', 'Build');
        ctx.say('<strong>Phase 1 - build the max-heap.</strong> Start at the last parent and sink each value.');
        showTree(n);
        await ctx.sleep(1600);

        for (var i = Math.floor(n / 2) - 1; i >= 0; i--) {
            await heapify(n, i);
        }

        ctx.stat('phase', 'Extract');
        ctx.say('<strong>Phase 2 - extract.</strong> The root now holds the largest value.');
        await ctx.sleep(1500);

        for (var end = n - 1; end > 0; end--) {
            ctx.setClass(0, 'active');
            ctx.setClass(end, 'active');
            ctx.say('Move the root ' + ctx.arr[0] + ' to position ' + end + ', its final place.');
            await ctx.sleep(1000);

            ctx.swap(0, end);
            ctx.bump('swaps');
            ctx.setClass(end, 'sorted');
            showTree(end);
            await ctx.sleep(800);

            for (var j = 0; j < end; j++) ctx.setClass(j, 'default');
            await heapify(end, 0);
            for (var s = end; s < n; s++) ctx.setClass(s, 'sorted');
        }

        ctx.hideAux();
    }
});
</script>

</body>
</html>
