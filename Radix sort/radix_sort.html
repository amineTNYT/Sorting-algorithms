<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radix Sort - Interactive Visualization</title>
<meta name="description" content="Sorts by one digit at a time, least significant first. Each pass is stable, so earlier passes survive the later ones.">
<link rel="stylesheet" href="../assets/visualizer.css">
<script>
    // Apply the saved theme before first paint, so the page never flashes
    // the wrong one on load.
    try {
        var savedTheme = localStorage.getItem('sorting-algorithms-theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (error) { /* storage unavailable - fall back to the OS preference */ }
</script>
</head>
<body>

<div class="container">

    <header class="page-header">
        <div>
            <h1>Radix Sort</h1>
            <p class="subtitle">Sorts by one digit at a time, least significant first. Each pass is stable, so earlier passes survive the later ones.</p>
        </div>
        <div class="header-actions">
            <a class="back-link" href="../index.html">All algorithms</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="panel">
        <div class="buttons">
            <button id="startBtn" type="button">Start Animation</button>
            <button id="generateBtn" type="button">Generate New Example</button>
            <button id="speedBtn" type="button">Speed: Slow (x1)</button>
        </div>
    </div>

    <div class="array-display">
        <div class="array-container" id="arrayContainer"></div>
        <div class="aux-panel" id="auxPanel">
            <div class="aux-title" id="auxTitle"></div>
            <div class="aux-row" id="auxRow"></div>
        </div>
    </div>

    <div class="steps" id="steps" role="status" aria-live="polite"></div>

    <div class="panel">
        <h2>Animation State</h2>
        <div class="status-info">
            <div class="info-item">
                <div class="info-label">Digit position</div>
                <div class="info-value" id="digit">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Passes</div>
                <div class="info-value" id="passes">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Writes</div>
                <div class="info-value" id="writes">0</div>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#fbbf24,#d97706)"></span>Reading digit
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#ef4444,#dc2626)"></span>Writing back
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#10b981,#059669)"></span>Final position
            </div>
        </div>
    </div>

    <footer class="page-footer">
        Created by <strong>Amine</strong> &middot;
        <a href="https://github.com/amineTNYT" target="_blank" rel="noopener">@amineTNYT</a>
        &middot; <a href="./README.md">Notes on this algorithm</a>
    </footer>

</div>

<script src="../assets/visualizer.js"></script>
<script>
SortingVisualizer.create({
    defaultExample: [170, 45, 75, 90, 802, 24, 2, 66],
    randomLength: 8,
    randomMin: 1,
    randomMax: 999,
    stats: [{ id: 'digit' }, { id: 'passes' }, { id: 'writes' }],
    run: async function (ctx) {
        var n = ctx.length;
        var maxVal = Math.max.apply(null, ctx.arr);
        var names = ['ones', 'tens', 'hundreds', 'thousands', 'ten-thousands'];

        function showBuckets(buckets, activeDigit) {
            var cells = [];
            for (var d = 0; d < 10; d++) {
                cells.push({
                    key: 'digit ' + d,
                    val: buckets[d].length ? buckets[d].join(', ') : '-',
                    highlight: d === activeDigit
                });
            }
            ctx.aux('Buckets for the current digit', cells);
        }

        var exp = 1;
        var passNumber = 0;

        while (Math.floor(maxVal / exp) > 0) {
            passNumber++;
            ctx.stat('passes', passNumber);
            ctx.stat('digit', names[passNumber - 1] || ('10^' + (passNumber - 1)));

            var buckets = [];
            for (var b = 0; b < 10; b++) buckets.push([]);

            ctx.setAll('default');
            showBuckets(buckets, null);
            ctx.say('<strong>Pass ' + passNumber + '</strong>: group every number by its <strong>' +
                    (names[passNumber - 1] || 'next') + '</strong> digit.');
            await ctx.sleep(1800);

            // Left to right, so equal digits keep their existing order (stability)
            for (var i = 0; i < n; i++) {
                var value = ctx.arr[i];
                var digit = Math.floor(value / exp) % 10;
                buckets[digit].push(value);

                ctx.setClass(i, 'comparing');
                showBuckets(buckets, digit);
                ctx.say(value + ' has digit <strong>' + digit + '</strong> here &rarr; into bucket ' + digit + '.');
                await ctx.sleep(800);
                ctx.setClass(i, 'default');
            }

            ctx.say('Now empty the buckets back into the array, from bucket 0 upward. ' +
                    'Equal digits keep the order they already had.');
            await ctx.sleep(1600);

            var writeIndex = 0;
            for (var d = 0; d < 10; d++) {
                if (!buckets[d].length) continue;
                showBuckets(buckets, d);

                for (var k = 0; k < buckets[d].length; k++) {
                    ctx.setValue(writeIndex, buckets[d][k]);
                    ctx.setClass(writeIndex, 'active');
                    ctx.bump('writes');
                    await ctx.sleep(600);
                    ctx.setClass(writeIndex, 'default');
                    writeIndex++;
                }
            }

            await ctx.sleep(900);
            exp *= 10;
        }

        ctx.hideAux();
    }
});
</script>

</body>
</html>
