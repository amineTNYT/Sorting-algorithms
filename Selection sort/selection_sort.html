<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selection Sort - Interactive Visualization</title>
<meta name="description" content="Scans the unsorted region for its smallest value, then swaps that value into place - exactly one swap per pass.">
<link rel="stylesheet" href="../assets/visualizer.css">
<script>
    // Apply the saved theme before first paint, so the page never flashes
    // the wrong one on load.
    try {
        var savedTheme = localStorage.getItem('sorting-algorithms-theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (error) { /* storage unavailable - fall back to the OS preference */ }
</script>
</head>
<body>

<div class="container">

    <header class="page-header">
        <div>
            <h1>Selection Sort</h1>
            <p class="subtitle">Scans the unsorted region for its smallest value, then swaps that value into place - exactly one swap per pass.</p>
        </div>
        <div class="header-actions">
            <a class="back-link" href="../index.html">All algorithms</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="panel">
        <div class="buttons">
            <button id="startBtn" type="button">Start Animation</button>
            <button id="generateBtn" type="button">Generate New Example</button>
            <button id="speedBtn" type="button">Speed: Slow (x1)</button>
        </div>
    </div>

    <div class="array-display">
        <div class="array-container" id="arrayContainer"></div>
        <div class="aux-panel" id="auxPanel">
            <div class="aux-title" id="auxTitle"></div>
            <div class="aux-row" id="auxRow"></div>
        </div>
    </div>

    <div class="steps" id="steps" role="status" aria-live="polite"></div>

    <div class="panel">
        <h2>Animation State</h2>
        <div class="status-info">
            <div class="info-item">
                <div class="info-label">Pass</div>
                <div class="info-value" id="pass">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Comparisons</div>
                <div class="info-value" id="comparisons">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Swaps</div>
                <div class="info-value" id="swaps">0</div>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#10b981,#059669)"></span>Final position
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#f472b6,#db2777)"></span>Smallest so far
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#fbbf24,#d97706)"></span>Comparing
            </div>
        </div>
    </div>

    <footer class="page-footer">
        Created by <strong>Amine</strong> &middot;
        <a href="https://github.com/amineTNYT" target="_blank" rel="noopener">@amineTNYT</a>
        &middot; <a href="./README.md">Notes on this algorithm</a>
    </footer>

</div>

<script src="../assets/visualizer.js"></script>
<script>
SortingVisualizer.create({
    defaultExample: [7, 4, 9, 2, 6],
    randomLength: 8,
    stats: [{ id: 'pass' }, { id: 'comparisons' }, { id: 'swaps' }],
    run: async function (ctx) {
        var n = ctx.length;

        for (var i = 0; i < n - 1; i++) {
            ctx.stat('pass', i + 1);
            var minIdx = i;

            ctx.setClass(minIdx, 'pivot');
            ctx.tag(minIdx, 'min');
            ctx.say('<strong>Pass ' + (i + 1) + '</strong>: assume ' + ctx.arr[minIdx] +
                    ' is the smallest, then check the rest.');
            await ctx.sleep(1200);

            for (var j = i + 1; j < n; j++) {
                ctx.bump('comparisons');
                ctx.setClass(j, 'comparing');
                ctx.say('Is ' + ctx.arr[j] + ' &lt; ' + ctx.arr[minIdx] + ' ?');
                await ctx.sleep(850);

                if (ctx.arr[j] < ctx.arr[minIdx]) {
                    ctx.say('Yes &rarr; ' + ctx.arr[j] + ' is the new smallest.');
                    ctx.setClass(minIdx, 'default');
                    ctx.untag(minIdx);
                    minIdx = j;
                    ctx.setClass(minIdx, 'pivot');
                    ctx.tag(minIdx, 'min');
                    await ctx.sleep(750);
                } else {
                    ctx.setClass(j, 'default');
                    await ctx.sleep(350);
                }
            }

            ctx.clearTags();
            if (minIdx !== i) {
                ctx.setClass(i, 'active');
                ctx.setClass(minIdx, 'active');
                ctx.say('Swap the smallest value ' + ctx.arr[minIdx] + ' into position ' + i + '.');
                await ctx.sleep(950);
                ctx.swap(i, minIdx);
                ctx.bump('swaps');
                await ctx.sleep(650);
            } else {
                ctx.say(ctx.arr[i] + ' was already the smallest, so no swap is needed.');
                await ctx.sleep(900);
            }

            ctx.setRange(0, i, 'sorted');
            for (var k = i + 1; k < n; k++) ctx.setClass(k, 'default');
        }

        ctx.setClass(n - 1, 'sorted');
    }
});
</script>

</body>
</html>
