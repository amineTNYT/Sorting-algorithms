<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubble Sort - Interactive Visualization</title>
<meta name="description" content="Repeatedly compares neighbouring elements and swaps them, letting the largest value bubble to the end of each pass.">
<link rel="stylesheet" href="../assets/visualizer.css">
<script>
    // Apply the saved theme before first paint, so the page never flashes
    // the wrong one on load.
    try {
        var savedTheme = localStorage.getItem('sorting-algorithms-theme');
        if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (error) { /* storage unavailable - fall back to the OS preference */ }
</script>
</head>
<body>

<div class="container">

    <header class="page-header">
        <div>
            <h1>Bubble Sort</h1>
            <p class="subtitle">Repeatedly compares neighbouring elements and swaps them, letting the largest value bubble to the end of each pass.</p>
        </div>
        <div class="header-actions">
            <a class="back-link" href="../index.html">All algorithms</a>
            <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch colour theme">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="panel">
        <div class="buttons">
            <button id="startBtn" type="button">Start Animation</button>
            <button id="generateBtn" type="button">Generate New Example</button>
            <button id="speedBtn" type="button">Speed: Slow (x1)</button>
        </div>
    </div>

    <div class="array-display">
        <div class="array-container" id="arrayContainer"></div>
        <div class="aux-panel" id="auxPanel">
            <div class="aux-title" id="auxTitle"></div>
            <div class="aux-row" id="auxRow"></div>
        </div>
    </div>

    <div class="steps" id="steps" role="status" aria-live="polite"></div>

    <div class="panel">
        <h2>Animation State</h2>
        <div class="status-info">
            <div class="info-item">
                <div class="info-label">Pass</div>
                <div class="info-value" id="pass">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Comparisons</div>
                <div class="info-value" id="comparisons">0</div>
            </div>
            <div class="info-item">
                <div class="info-label">Swaps</div>
                <div class="info-value" id="swaps">0</div>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#fbbf24,#d97706)"></span>Comparing
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#ef4444,#dc2626)"></span>Swapping
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:linear-gradient(135deg,#10b981,#059669)"></span>In final position
            </div>
        </div>
    </div>

    <footer class="page-footer">
        Created by <strong>Amine</strong> &middot;
        <a href="https://github.com/amineTNYT" target="_blank" rel="noopener">@amineTNYT</a>
        &middot; <a href="./README.md">Notes on this algorithm</a>
    </footer>

</div>

<script src="../assets/visualizer.js"></script>
<script>
SortingVisualizer.create({
    defaultExample: [5, 3, 8, 1, 4],
    randomLength: 8,
    stats: [{ id: 'pass' }, { id: 'comparisons' }, { id: 'swaps' }],
    run: async function (ctx) {
        var n = ctx.length;
        var pass = 0;
        var swapped = true;

        // Everything from this index onward is already in its final place
        function restore(index, settledFrom) {
            ctx.setClass(index, index >= settledFrom ? 'sorted' : 'default');
        }

        while (swapped && pass < n) {
            swapped = false;
            pass++;
            ctx.stat('pass', pass);
            var settledFrom = n - pass + 1;

            ctx.say('<strong>Pass ' + pass + '</strong>: walk left to right, comparing each neighbouring pair.');
            await ctx.sleep(1100);

            for (var i = 0; i < n - pass; i++) {
                ctx.bump('comparisons');
                ctx.setClass(i, 'comparing');
                ctx.setClass(i + 1, 'comparing');
                ctx.say('Is ' + ctx.arr[i] + ' &gt; ' + ctx.arr[i + 1] + ' ?');
                await ctx.sleep(950);

                if (ctx.arr[i] > ctx.arr[i + 1]) {
                    ctx.setClass(i, 'active');
                    ctx.setClass(i + 1, 'active');
                    ctx.say('Yes &rarr; swap them so the larger value moves right.');
                    await ctx.sleep(700);
                    ctx.swap(i, i + 1);
                    ctx.bump('swaps');
                    swapped = true;
                    await ctx.sleep(550);
                } else {
                    ctx.say('No &rarr; this pair is already in order.');
                    await ctx.sleep(550);
                }

                restore(i, settledFrom);
                restore(i + 1, settledFrom);
            }

            if (n - pass >= 0) ctx.setClass(n - pass, 'sorted');

            if (!swapped) {
                ctx.say('<strong>No swaps in this pass</strong> &rarr; the array is already sorted, so we stop early.');
                await ctx.sleep(1400);
            }
        }
    }
});
</script>

</body>
</html>
